# Builds upstream avelino/mcp release tags and publishes them as releases of
# this fork, with SHA256SUMS and build provenance attestations.
#
# - schedule: builds the latest upstream stable release if this fork does not
#   have a release for it yet.
# - workflow_dispatch: builds a given upstream tag (default: latest).
#
# Patches in patches/*.patch (on this branch) are applied in name order on
# top of the upstream source before the build.

name: Fork release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build, e.g. v0.6.2 (default: latest upstream release)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: avelino/mcp

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" -q .tag_name)}"
          # Stable versions only: mise treats anything with a suffix as a prerelease.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a stable version tag: $tag"
            exit 1
          fi
          sha="$(gh api "repos/$UPSTREAM/commits/$tag" -q .sha)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists in $GITHUB_REPOSITORY, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $UPSTREAM $tag ($sha)."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc builds run in manylinux_2_28 (AlmaLinux 8), so the binaries
          # need glibc 2.28 or later (RHEL 8+, Debian 10+, Ubuntu 18.10+).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            smoke: true
          # musl builds are static and run on any Linux, including Alpine.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            smoke: false
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: false
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    env:
      # chrondb's build script downloads its native library into ~/.chrondb
      # for convenience. The binary does not need it at build time.
      CHRONDB_SKIP_DOWNLOAD: "1"
    steps:
      - name: Check out upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Check out patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _dist
          sparse-checkout: patches
          persist-credentials: false

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for p in _dist/patches/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          rm -rf _dist

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build
        if: "!matrix.cross"
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "target/${{ matrix.target }}/release/mcp" "out/mcp-${{ matrix.target }}"
          chmod +x "out/mcp-${{ matrix.target }}"

      - name: Check glibc floor
        if: endsWith(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          max="$(objdump -T "out/mcp-${{ matrix.target }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "Highest glibc symbol version: $max"
          if [ "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
            echo "::error::binary needs $max, above GLIBC_2.28"
            exit 1
          fi

      - name: Check static linking
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          set -euo pipefail
          file "out/mcp-${{ matrix.target }}"
          if file "out/mcp-${{ matrix.target }}" | grep -q 'dynamically linked'; then
            echo "::error::musl binary is dynamically linked"
            exit 1
          fi

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          "out/mcp-${{ matrix.target }}" --version
          "out/mcp-${{ matrix.target }}" --version | grep -qF "${NEED_VERSION#v}"
        env:
          NEED_VERSION: ${{ needs.resolve.outputs.tag }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-${{ matrix.target }}
          path: out/mcp-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mcp-*
          path: out
          merge-multiple: true

      - name: Check artifacts
        run: |
          set -euo pipefail
          cd out
          chmod +x mcp-*
          ls -l
          test "$(ls mcp-* | wc -l)" -eq 6
          # This runner is aarch64 Linux: smoke test the one build that the
          # build matrix could not run.
          ./mcp-aarch64-unknown-linux-musl --version
          sha256sum mcp-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/mcp-*

      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          if have="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha 2>/dev/null)"; then
            if [ "$have" != "$SHA" ]; then
              echo "::error::tag $TAG in $GITHUB_REPOSITORY points to $have, upstream has $SHA"
              exit 1
            fi
            echo "Tag $TAG exists and matches upstream."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null
            echo "Created tag $TAG at $SHA."
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          patches="$(gh api "repos/$GITHUB_REPOSITORY/contents/patches?ref=$GITHUB_SHA" -q '[.[].name | select(endswith(".patch"))] | join(", ")')"
          {
            echo "Build of [$UPSTREAM $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) at \`$SHA\`."
            echo
            echo "Patches: ${patches:-none}"
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "$TAG" \
            --notes-file notes.md \
            out/mcp-* out/SHA256SUMS
